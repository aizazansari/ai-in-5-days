[project]
name = "shopguard-ecommerce-support-agent"
version = "1.0.0"
description = "Enterprise E-Commerce Order Support Multi-Agent System built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.16.0",
    "google-genai>=1.10.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.21.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "python-json-logger>=2.0.7",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
